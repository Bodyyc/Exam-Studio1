<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--ln:#e3e2db;--ac:#1d5fd1;--ok:#1f8a4c;--wa:#b7791f;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1e;--tx:#ecebe6;--mu:#a09f97;--ln:#34332f;--ac:#6ea0ff;--ok:#4cc78a;--wa:#e3b04b;--er:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#201f1e;--tx:#ecebe6;--mu:#a09f97;--ln:#34332f;--ac:#6ea0ff;--ok:#4cc78a;--wa:#e3b04b;--er:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--ln);align-items:center}
nav b{margin-right:10px}nav a{padding:6px 12px;border-radius:8px;color:var(--mu);text-decoration:none;font-size:14px}nav a.on{background:var(--ac);color:#fff}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0}h2{font-size:19px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin:12px 0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu);margin-right:6px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.g{border-color:var(--ok);color:var(--ok)}button.w{border-color:var(--wa);color:var(--wa)}button.m{border-color:var(--er);color:var(--er)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
pre,code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}pre{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre-wrap;margin:8px 0}
.ans{border-left:3px solid var(--ac);padding-left:12px;margin-top:10px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:right}th:first-child,td:first-child{text-align:left}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:12px 0}.gc{text-align:left;padding:12px;line-height:1.45;background:var(--card)}.sc{overflow-x:auto}.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.er{color:var(--er)}
</style></head><body>

// ---------- Question bank: every item is traceable to a provided course file ----------
const Q=[
["NYC film permits","Excel","In the NYC Film Permits file, how many records and how many columns does the table have?","33,502 records and 14 columns. Check with ROWS()/COLUMNS() or the status bar after Ctrl+A on the data.","PWC Excel Assignment"],
["NYC film permits","Excel","How many records have a missing ZipCode, and how can you count them with a formula?","11 records. =COUNTBLANK(N2:N33503) (invalid values such as short or non-numeric codes are a separate check: 2 records).","PWC Excel Assignment"],
["NYC film permits","Excel","Which column holds the same value in every record, and what is the most common EventType?","EventAgency is constant. The most common EventType is Shooting Permit (4 distinct types in total). Use a PivotTable on EventType or =COUNTIF.","PWC Excel Assignment"],
["NYC film permits","Excel","Considering only Shooting Permits: what is the most common Category, how many student-film permits exist, and what share needed more than one Community Board?","Television is the most common Category. 193 student-film permits. 7.84% needed more than one board (a comma in CommunityBoard(s) signals several: count rows containing a comma, divide by all shooting permits).","PWC Excel Assignment"],
["ETL","Excel","ETL Case 2: EmployeeCode looks like USA1234-12W. Give formulas to extract Location, EmpID, PlantID, PayPeriod and the LocationPlantID key (e.g. USA-12).","Location =LEFT(A2,3)\nEmpID =MID(A2,4,FIND(\"-\",A2)-4)\nPlantID =MID(A2,FIND(\"-\",A2)+1,2)\nPayPeriod =RIGHT(A2,1)\nKey =J2&\"-\"&L2 (Location&\"-\"&PlantID)","ETL Case 2"],
["ETL","Excel","ETL Case 3: codes are messier (country codes of different length, PayPeriod is W/We/M/Mo). Which function idea handles the variable-length country code and pay period?","Find the first digit position (MIN of FIND for 0-9 inside an array, or test ISNUMBER(VALUE(MID(...)))) to cut Location with LEFT. Take everything after the last digit for PayPeriod, then standardise with IF(LEFT(x,1)=\"W\",\"W\",\"M\"). Flash Fill is the non-formula alternative but is not repeatable.","ETL Case 3"],
["ETL","Excel","Why is a comma a risky delimiter, and what is the remedy? Why can Employee_ID alone fail as a unique identifier?","Commas also appear inside text or numbers (e.g. $42,000), so fields split wrongly. Use a text qualifier (double quotes) or a rarer delimiter such as the pipe (AICPA standard). IDs can repeat across locations, so the combination Employee_ID + Location is the unique key.","ETL overview"],
["ETL","Excel","ETL Case 4: which join gives ALL journal entries plus account, unit, preparer and source details, and why must PreparerName use two keys?","A left join with JELineItems on the left (every entry kept, unmatched lookups return blank). Use INDEX/MATCH rather than VLOOKUP. PreparerID restarts in each business unit, so the key is PreparerID + BusinessUnitID (array MATCH over both), then concatenate first and last name.","ETL Case 4"],
["IntegrateCo","Excel","IntegrateCo: 2015 data is per employee × job × pay date, 2016 per employee × project with no dates. What must you do before comparing, and how is 2016 Gross_Wages related to 2015?","Aggregate 2015 to employee × project level (no dates) and extract the three-digit job code from the Job/Project string (skip the leading 2-digit year, optional H/S, and optional B/SG location). Gross_Wages (2016) = Reg_Pay + OT_Pay (2015); Hours = Reg_Hrs. Keep job codes as text (001).","IntegrateCo"],
["IntegrateCo","Excel","How do you find overtime without 40 regular hours in 2015, and how do you spot the 2016 phantom entries?","Sum Reg_Hrs and OT_Hrs per employee and Pay_Date (same date = same pay period), then keep rows where Reg < 40 and OT > 0. Phantom entries are 2016 rows with a blank Employee_Number: count them and sum their Gross_Wages.","IntegrateCo Part 4"],
["Chinook","SQL","How many invoices have a total greater than $20, and how many are between $10 and $20 (exclusive)?","SELECT COUNT(*) FROM Invoice WHERE Total > 20;  → 4\nSELECT COUNT(*) FROM Invoice WHERE Total > 10 AND Total < 20;  → 60","PWC SQL"],
["Chinook","SQL","How many invoices have a billing country starting with \"C\", and how many come from Brazil, Argentina or Chile?","SELECT COUNT(*) FROM Invoice WHERE BillingCountry LIKE 'C%';  → 77\nSELECT COUNT(*) FROM Invoice WHERE BillingCountry IN ('Brazil','Argentina','Chile');  → 49","PWC SQL"],
["Chinook","SQL","Return countries by total invoice value, highest first.","SELECT BillingCountry, SUM(Total) AS TotalValue\nFROM Invoice GROUP BY BillingCountry ORDER BY TotalValue DESC;","PWC SQL"],
["Chinook","SQL","Return the five most downloaded tracks with full name and number of downloads. What is the most popular genre?","SELECT t.Name, COUNT(*) AS Downloads\nFROM InvoiceLine il JOIN Track t ON t.TrackId = il.TrackId\nGROUP BY t.TrackId ORDER BY Downloads DESC LIMIT 5;\nMost popular genre: Rock (join Track → Genre, GROUP BY genre).","PWC SQL"],
["CS50 songs","SQL","List the names of the top 3 longest songs. Which songs have danceability, energy and valence all above 0.6?","SELECT name FROM songs ORDER BY duration_ms DESC LIMIT 3;  → Te Bote - Remix, SICKO MODE, Walk It Talk It\nSELECT name FROM songs WHERE danceability>0.6 AND energy>0.6 AND valence>0.6;  → 23 songs","CS50 songs"],
["CS50 songs","SQL","How many songs are by Drake (without assuming his artist_id), and what is Post Malone’s average energy?","SELECT COUNT(*) FROM songs WHERE artist_id = (SELECT id FROM artists WHERE name='Drake');  → 4\nSELECT AVG(energy) FROM songs WHERE artist_id = (SELECT id FROM artists WHERE name='Post Malone');  → about 0.609","CS50 songs"],
["CS50 songs","SQL","List songs that feature other artists. How many are there?","SELECT name FROM songs WHERE name LIKE '%feat.%';  → 18 songs","CS50 songs"],
["CS50 movies","SQL","What is Johnny Depp’s birth year, and how many movies have an IMDb rating above 9.0?","SELECT birth FROM people WHERE name='Johnny Depp';  → 1963\nSELECT COUNT(*) FROM ratings WHERE rating > 9.0;  → 1297","CS50 movies"],
["CS50 movies","SQL","What is the average rating of movies released in 2013?","SELECT AVG(rating) FROM ratings JOIN movies ON movies.id = ratings.movie_id WHERE year = 2013;  → about 6.234","CS50 movies"],
["CS50 movies","SQL","List the titles of all movies in which both Johnny Depp and Helena Bonham Carter starred.","SELECT title FROM movies JOIN stars ON id=movie_id\nWHERE person_id=(SELECT id FROM people WHERE name='Johnny Depp')\nINTERSECT\nSELECT title FROM movies JOIN stars ON id=movie_id\nWHERE person_id=(SELECT id FROM people WHERE name='Helena Bonham Carter');\n→ 6 titles (Alice in Wonderland, Charlie and the Chocolate Factory, Corpse Bride, Dark Shadows, Sweeney Todd, Alice Through the Looking Glass)","CS50 movies"],
["P-card","SQL","How many P-card transactions are in the database, and how many are for $5,000 or more?","SELECT COUNT(*) FROM pcards;  → 489,178\nSELECT COUNT(*) FROM pcards WHERE Amount >= 5000;  → 1,187","P-card Task 4"],
["P-card","SQL","Transactions per year, most recent year first.","SELECT Year, COUNT(*) AS TotalTrans FROM pcards GROUP BY Year ORDER BY Year DESC;\n→ 2014: 116,031 · 2013: 116,595 · 2012: 117,711 · 2011: 116,188 · 2010: 22,653","P-card Task 4"],
["P-card","SQL","How much sales tax (4.5%) did OSU avoid in 2014, and how would you test for duplicate payments?","SELECT ROUND(SUM(Amount)*0.045,2) AS SalesTaxSaved FROM pcards WHERE Year=2014;  → 1,507,686.68\nDuplicates (same person, vendor, date, amount, excluding returns):\nSELECT FullName,Vendor,TransactionDate,Amount,COUNT(*) FROM pcards WHERE Year=2014 AND Amount>0 GROUP BY 1,2,3,4 HAVING COUNT(*)>1;  → 1,732 groups","P-card Task 4/7"],
["P-card","SQL","Which control would a split-purchase test (Task 5) check, and what is the query logic?","Policy: single transaction limit is $5,000. Group by cardholder, vendor and day; keep groups with COUNT(*)>1 and SUM(Amount)>5000. Variants: two cardholders at one vendor, or one cardholder at two vendors on the same day.","P-card Task 5"]
].map((r,i)=>({id:"q"+i,topic:r[0],tool:r[1],q:r[2],a:r[3],src:r[4]}));

// ---------- helpers ----------
const $=s=>document.querySelector(s),A=$("#app");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const DAY=864e5,GAP=[0,1,3,7,14];
let P={};try{P=JSON.parse(localStorage.getItem("pl_prog")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("pl_prog",JSON.stringify(P))}catch(e){}};
const rate=(id,v)=>{const p=P[id]||{box:0};p.box=v==2?Math.min(4,p.box+1):v==1?p.box:0;p.due=Date.now()+GAP[p.box]*DAY;p.n=(p.n||0)+1;P[id]=p;save()};
const isDue=q=>P[q.id]&&P[q.id].due<=Date.now()&&P[q.id].box<4;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function card(q,i){return `<div class="card"><span class="tag">${q.tool}</span><span class="tag">${esc(q.topic)}</span><span class="tag">source: ${esc(q.src)}</span>
<p>${i!=null?`<b>${i}.</b> `:""}${esc(q.q)}</p><div id="a-${q.id}"><button onclick="reveal('${q.id}')">Show model answer</button></div></div>`}
function reveal(id){const q=Q.find(x=>x.id==id)||G[id],b=P[id]?`<span class="mu">Box ${P[id].box}/4 · attempts ${P[id].n}</span>`:"";
$("#a-"+id).innerHTML=`<div class="ans"><pre>${esc(q.a)}</pre><div class="row"><span class="mu">How did you do?</span><button class="m" onclick="rt('${id}',0)">Missed it</button><button class="w" onclick="rt('${id}',1)">Partly</button><button class="g" onclick="rt('${id}',2)">Got it</button>${b}</div></div>`}
function rt(id,v){if(id[0]!="g")rate(id,v);$("#a-"+id).innerHTML=`<span class="${v==2?"ok":"er"}">Saved. ${v==2?"Moves up a box; shows again later.":v==1?"Stays in the same box.":"Back to box 0: due for review now."}</span>`}

// ---------- views ----------
const V={};
V.home=()=>{const d=Q.filter(isDue).length,seen=Q.filter(q=>P[q.id]).length;
A.innerHTML=`<h1>Practice the exam you will actually take</h1><p>The oral exam contains one full <b>data manipulation exam</b> (Excel and SQL) and one full <b>data interpretation (regression) exam</b>. Everything here is built from the course cases: NYC film permits, ETL, IntegrateCo, Chinook, CS50 songs and movies, P-cards, and the restaurant regression. There are 800 data manipulation exams (E001 to E800) and 30 data interpretation exams (REG001 to REG030); each ID is the same for everyone.</p>
<div class="card"><h2 style="margin-top:0">Your status</h2><p>${seen} of ${Q.length} questions attempted · <b>${d}</b> due for review.</p><div class="row"><a href="#progress"><button class="p">Open my readiness dashboard</button></a><a href="#exams"><button>Start an exam</button></a></div></div>
<div class="card"><b>What is new compared with a plain question list:</b> every answer you reveal is self-graded, and the site turns that into a topic-by-topic readiness score and a spaced-repetition review queue, so you spend your time on what you actually miss.</div>`};
V.bank=()=>{const T=[...new Set(Q.map(q=>q.topic))];
A.innerHTML=`<h1>Question bank</h1><div class="row"><select id="ft"><option value="">All tools</option><option>Excel</option><option>SQL</option></select><select id="fp"><option value="">All topics</option>${T.map(t=>`<option>${esc(t)}</option>`).join("")}</select></div><div id="list"></div>`;
const f=()=>{const t=$("#ft").value,p=$("#fp").value;$("#list").innerHTML=Q.filter(q=>(!t||q.tool==t)&&(!p||q.topic==p)).map(q=>card(q)).join("")};$("#ft").onchange=$("#fp").onchange=f;f()};
let tm=null;
const pk=(a,r)=>a[Math.floor(r()*a.length)],ri=(a,b,r)=>a+Math.floor(r()*(b-a+1)),fm=n=>n.toLocaleString("en-US"),sg=x=>Number(x.toPrecision(3)),pad=n=>String(n).padStart(3,"0");
const mk=(tool,topic,q,a,src)=>({id:"g",tool,topic,q,a,src}),G={};
const D={ch:{USA:91,Canada:56,France:35,Brazil:35,Germany:28,"United Kingdom":21,Portugal:14,"Czech Republic":14,India:13,Sweden:7},inv:{2:242,5:179,8:120,10:64,12:61},cust:{USA:13,Canada:8,France:5,Brazil:5,Germany:4,"United Kingdom":3},so:{XXXTENTACION:6,"Post Malone":6,Drake:4,Marshmello:3,"Ed Sheeran":3,"The Weeknd":2,"Selena Gomez":2,Ozuna:2},mv:{2000:4902,2003:5583,2006:7532,2009:11030,2012:13591,2015:15974},mr:{2000:138,2003:281,2006:405,2009:632,2012:804,2015:926},pc:{500:17482,1000:7579,2000:2771,3000:1219,5000:53},pm:{1:9599,3:9899,6:9879,9:10226,12:6907}};
const kv=(o,r)=>{const k=pk(Object.keys(o),r);return[k,o[k]]},sq=(t,q,s,n,src)=>mk("SQL",t,q,`${s}  → ${fm(n)}`,src);
// Excel generators (answers computed live)
const C2=["ARG","AUS","CAN","ENG","GER","JAP","MEX","USA"],C3=["ARG","AUS","Canada","ENG","GER","Japan","MEX","US"];
const gc2=r=>{const L=pk(C2,r),e=ri(1000,1597,r),p=ri(10,19,r),w=pk(["W","M"],r),c=L+e+"-"+p+w,T=[["Location","=LEFT(A2,3)",L],["EmpID","=MID(A2,4,FIND(\"-\",A2)-4)",e],["PlantID","=MID(A2,FIND(\"-\",A2)+1,2)",p],["PayPeriod","=RIGHT(A2,1)",w],["LocationPlantID","=LEFT(A2,3)&\"-\"&MID(A2,FIND(\"-\",A2)+1,2)",L+"-"+p]][ri(0,4,r)];return mk("Excel","Plant codes",`ETL Case 2: the EmployeeCode in A2 is ${c}. Which formula extracts ${T[0]}, and what does it return?`,`${T[1]}  → ${T[2]}`,"ETL Case 2")};

const gjob=r=>{const y=pk([14,15],r),d=pk(["","H","S"],r),j=pad(ri(1,12,r)),l=pk(["","B","SG"],r);return mk("Excel","Job codes",`IntegrateCo: the Job field reads ${y+d+j+l}. Give the project start year, department, three-digit job code and location code.`,`Year 20${y} · department ${d||"none"} · job code ${j} · location ${l||"none"}.\nKeep the job code as text (001, not 1).`,"IntegrateCo")};
const gwage=r=>{const rp=ri(800,4000,r)+ri(0,99,r)/100,op=ri(0,900,r)+ri(0,99,r)/100,rh=ri(40,160,r),oh=ri(0,30,r),g=rp+op;return mk("Excel","Job codes",`IntegrateCo 2015 row: Reg_Pay ${rp.toFixed(2)}, OT_Pay ${op.toFixed(2)}, Reg_Hrs ${rh}, OT_Hrs ${oh}. What is the equivalent 2016 Gross_Wages, and the gross pay per hour over all hours?`,`Gross_Wages = Reg_Pay + OT_Pay = ${g.toFixed(2)}\nPay per hour = ${g.toFixed(2)} / ${rh+oh} = ${(g/(rh+oh)).toFixed(2)}`,"IntegrateCo")};
const gjoin=r=>{const n=ri(6,12,r),a=ri(2,n-1,r),b=a+ri(0,4,r),u=ri(1,4,r),t=pk(["inner","left","right","full outer"],r),v={inner:b,left:b+n-a,right:b+u,"full outer":b+n-a+u}[t];return mk("Excel","Joins & data quality",`ETL join: the Customer table has ${n} customers; ${a} of them placed orders, ${b} orders in total belong to those customers, and ${u} further orders have no customer ID. How many rows does a ${t} join (Customer to Orders on Customer_ID) return?`,`${v} rows. Inner = matched orders (${b}); left adds customers without orders (${n-a}); right adds orders without a customer (${u}); full outer adds both.`,"ETL overview")};
const s=i=>()=>Q[i];
const EX={"Plant codes":[gc2,gc2,gc3,gc3,s(4),s(5)],"Job codes":[gjob,gjob,gwage,gwage,s(8),s(9)],"Joins & data quality":[gjoin,gjoin,gjoin,s(6),s(7),s(0),s(1),s(2),s(3)]};
// SQL generators (answers precomputed from the course databases)
const g1=(t,f)=>r=>{const[k,n]=kv(D[f[0]],r);return sq(t,f[1](k),f[2](k),n,f[3])};
const SX={"Chinook":[g1("Chinook",["ch",k=>`How many invoices have the billing country ${k}?`,k=>`SELECT COUNT(*) FROM Invoice WHERE BillingCountry = '${k}';`,"PWC SQL"]),g1("Chinook",["inv",k=>`How many invoices have a total greater than $${k}?`,k=>`SELECT COUNT(*) FROM Invoice WHERE Total > ${k};`,"PWC SQL"]),g1("Chinook",["cust",k=>`How many customers are located in ${k}?`,k=>`SELECT COUNT(*) FROM Customer WHERE Country = '${k}';`,"PWC SQL"]),s(10),s(11),s(12),s(13)],
"CS50 songs":[g1("CS50 songs",["so",k=>`How many songs are by ${k}? Do not assume the artist_id.`,k=>`SELECT COUNT(*) FROM songs WHERE artist_id = (SELECT id FROM artists WHERE name = '${k}');`,"CS50 songs"]),g1("CS50 songs",["so",k=>`How many songs by ${k} are in the database?`,k=>`SELECT COUNT(*) FROM songs JOIN artists ON artists.id = songs.artist_id WHERE artists.name = '${k}';`,"CS50 songs"]),s(14),s(15),s(16)],
"CS50 movies":[g1("CS50 movies",["mv",k=>`How many movies were released in ${k}?`,k=>`SELECT COUNT(*) FROM movies WHERE year = ${k};`,"CS50 movies"]),g1("CS50 movies",["mr",k=>`How many movies released in ${k} have an IMDb rating of at least 8.0?`,k=>`SELECT COUNT(*) FROM movies JOIN ratings ON movies.id = ratings.movie_id WHERE year = ${k} AND rating >= 8;`,"CS50 movies"]),s(17),s(18),s(19)],
"P-cards":[g1("P-cards",["pc",k=>`How many 2014 P-card transactions are for $${k} or more?`,k=>`SELECT COUNT(*) FROM pcards WHERE Year = 2014 AND Amount >= ${k};`,"P-card Task 4"]),g1("P-cards",["pm",k=>`How many P-card transactions were made in month ${k} of 2014?`,k=>`SELECT COUNT(*) FROM pcards WHERE Year = 2014 AND Month = ${k};`,"P-card Task 4"]),s(20),s(21),s(22),s(23)]};
const XT=Object.keys(EX),ST=Object.keys(SX),theme=n=>[XT[(n-1)%3],ST[Math.floor((n-1)/3)%4]];
function draw(L,r,k,n,off){const out=[],seen={};let t=0;while(out.length<k&&t++<80){const q=pk(L,r)(r);if(seen[q.q])continue;seen[q.q]=1;const x={...q,id:q.id=="g"?"g"+n+"_"+(off+out.length):q.id};G[x.id]=x;out.push(x)}return out}
function exam(n){const r=rng(n*7919+13),[e,s]=theme(n),qs=[...draw(EX[e],r,4,n,0),...draw(SX[s],r,4,n,4)];

V.exams=()=>{clearInterval(tm);const o=a=>a.map(t=>`<option>${esc(t)}</option>`).join("");
A.innerHTML=`<h1>Data manipulation exams</h1><p>800 exams, each with 8 questions (4 Excel and 4 SQL) built around one Excel topic and one SQL topic. Exam IDs are fixed, so E123 is the same for everyone. Many numbers, codes and filters change from exam to exam.</p><div class="row"><button class="p" onclick="exam(1+Math.floor(Math.random()*800))">Choose one for me</button><select id="fe"><option value="">All Excel topics</option>${o(XT)}</select><select id="fs"><option value="">All SQL topics</option>${o(ST)}</select></div><div id="ex"></div><div class="grid" id="gr"></div>`;

V.progress=()=>{const T=[...new Set(Q.map(q=>q.topic))],due=Q.filter(isDue);
const rows=T.map(t=>{const l=Q.filter(q=>q.topic==t),m=l.reduce((s,q)=>s+(P[q.id]?P[q.id].box:0),0)/(l.length*4)*100,a=l.filter(q=>P[q.id]).length;
return `<tr><td>${esc(t)}</td><td>${a}/${l.length}</td><td style="width:40%"><div class="bar"><i style="width:${m}%"></i></div></td><td>${Math.round(m)}%</td></tr>`}).join("");
const tot=Math.round(Q.reduce((s,q)=>s+(P[q.id]?P[q.id].box:0),0)/(Q.length*4)*100);
A.innerHTML=`<h1>My readiness: ${tot}%</h1><p class="mu">Progress is stored only in this browser. Readiness counts a question as mastered after you rate it “Got it” on several separate days.</p><div class="card sc"><table><tr><th>Topic</th><th>Tried</th><th></th><th>Mastery</th></tr>${rows}</table></div>
<h2>Review queue (${due.length} due)</h2>${due.length?due.map(q=>card(q)).join(""):`<p class="mu">Nothing due. Attempt more questions or come back tomorrow.</p>`}
<div class="row"><button onclick="if(confirm('Erase all progress?')){P={};save();V.progress()}">Reset progress</button></div>`};

// ---------- regression exams: 30 themed exams x 4 questions, each question has its own model ----------
const RD=`Apartment prices|monthly rent ($)|1400|size (m²):30-150+,building age (years):0-60-,distance to centre (km):1-15-,balconies:0-2+
Restaurant sales|daily net sales ($)|3000|temperature (°F):30-95+,game day (1 = yes):0-1+,sales 364 days ago ($):1500-4000+,rainfall (inches):0-2-
Employee wages|hourly wage ($)|25|years of experience:0-30+,education (years):10-20+,weekly hours:20-60+,commute (km):0-50-

function model(D,r){const u=(a,b)=>a+(b-a)*r(),V=shuffle(D.v,r).slice(0,3).map(v=>{const b=sg(v.s*D.b*u(.08,.3)/(v.hi-v.lo)),se=sg(Math.abs(b)/(r()<.35?u(.5,1.7):u(2.6,9)));return{...v,b,se,t:b/se,x:v.hi-v.lo==1?(r()<.5?1:0):ri(v.lo,v.hi,r)}}),b0=sg(D.b*u(.3,.6));return{D,V,b0,se0:sg(b0/u(3,8)),r2:+u(.45,.92).toFixed(2),n:ri(80,400,r)}}
const tbl=m=>`<div class="sc"><b>Dependent variable: ${esc(m.D.dv)} · R² = ${m.r2} · n = ${m.n}</b><table><tr><th>Variable</th><th>Coefficient</th><th>Std. error</th><th>t-stat</th></tr><tr><td>Intercept</td><td>${m.b0}</td><td>${m.se0}</td><td>${(m.b0/m.se0).toFixed(2)}</td></tr>${m.V.map(v=>`<tr><td>${esc(v.n)}</td><td>${v.b}</td><td>${v.se}</td><td>${v.t.toFixed(2)}</td></tr>`).join("")}</table></div>`;
V.regression=()=>{A.innerHTML=`<h1>Data interpretation exams</h1><p>Each exam contains four regression questions. Each question has its own model and coefficients.</p><div class="row"><button class="p" onclick="reg(1+Math.floor(Math.random()*30))">Choose one for me</button></div><div id="rg"></div><h2>Browse all 30 data interpretation exams</h2><div class="grid">${RD.map((d,i)=>`<button class="gc" onclick="reg(${i+1})"><span class="mu">REG${pad(i+1)}${P["x_REG"+(i+1)]?" ✓":""}</span><br><b>${esc(d.n)}</b><br><span class="mu">4 questions · Data interpretation</span></button>`).join("")}</div>`};
function reg(n){const D=RD[n-1];window.K=[];let h=`<h2>REG${pad(n)} · ${esc(D.n)}</h2>`;
for(let i=0;i<4;i++){const r=rng(n*1000+i*37+5),m=model(D,r),v=m.V[ri(0,2,r)];let q,a;
if(i==0){const p=m.b0+m.V.reduce((s,w)=>s+w.b*w.x,0);q=`Predict ${D.dv} when ${m.V.map(w=>w.n+" = "+w.x).join("; ")}.`;a={k:"n",v:p,tol:Math.max(.5,Math.abs(p)*.005),h:"Intercept + Σ coefficient × value = "+p.toFixed(2)}}
else if(i==1){const k=v.hi-v.lo==1?1:pk([1,5,10],r);q=`By how much does ${D.dv} change when ${v.n} rises by ${k}, other variables held fixed?`;a={k:"n",v:v.b*k,tol:Math.abs(v.b*k)*.01+.001,h:k+" × "+v.b+" = "+sg(v.b*k)}}
else if(i==2){const z=Math.abs(v.t)>1.96;q=`Is ${v.n} statistically significant at the 5% level (use |t| > 1.96)?`;a={k:"b",v:z,h:"|t| = "+Math.abs(v.t).toFixed(2)+(z?", above 1.96: significant.":", below 1.96: not significant.")}}
else{const lo=v.b-1.96*v.se;q=`Give the lower bound of the approximate 95% confidence interval for the coefficient on ${v.n}.`;a={k:"n",v:lo,tol:Math.abs(lo)*.01+.001,h:v.b+" − 1.96 × "+v.se+" = "+sg(lo)}}
K.push(a);h+=`<div class="card"><p><b>${i+1}.</b> ${esc(q)}</p>${tbl(m)}<div class="row">${a.k=="n"?`<input id="r${i}" type="number" step="any"><button onclick="ck(${i})">Check</button>`:`<button onclick="ck(${i},1)">Yes</button><button onclick="ck(${i},0)">No</button>`}<span id="o${i}"></span></div></div>`}
$("#rg").innerHTML=h+`<div class="row"><button class="g" onclick="done('x_REG${n}',this)">Mark exam as done</button></div>`;scrollTo(0,0)}
function ck(i,v){const a=K[i],ok=a.k=="n"?Math.abs(+$("#r"+i).value-a.v)<=a.tol:(v==1)==a.v;$("#o"+i).innerHTML=ok?`<b class="ok">Correct.</b> ${a.h}`:`<b class="er">Not quite.</b> ${a.h}`}
